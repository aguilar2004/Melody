<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un Mensaje para Ti Melody</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      font-family: 'Dancing Script', cursive;
      cursor: pointer;
      position: relative;
    }

    #lluvia-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .gota {
      position: absolute;
      /* --- ESTA ES LA LÍNEA CLAVE DE LA CORRECCIÓN --- */
      top: -15vh; /* Posiciona cada gota fuera de la pantalla desde el inicio */
      color: rgba(255, 25, 80, 0.8);
      font-weight: bold;
      user-select: none;
      pointer-events: none;
      animation: caer 10s linear infinite; 
    }

    @keyframes caer {
      /* La animación ahora solo necesita moverlo hacia abajo */
      to {
        transform: translateY(120vh); /* Aumentado para asegurar que desaparezca por completo */
        opacity: 0;
      }
    }

    .explosion {
      position: absolute;
      color: #d90429;
      font-size: 28px;
      font-weight: bold;
      animation: estallar 1.2s ease-out forwards;
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
    }

    @keyframes estallar {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.2);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(2);
      }
    }

    .texto-central {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
      text-align: center;
      z-index: 10;
    }

    .texto-central h1 {
      font-size: 4.5em;
      margin: 0;
    }

    .texto-central p {
      font-size: 1.5em;
      margin-top: 10px;
      font-family: 'Arial', sans-serif;
      font-style: italic;
      opacity: 0.8;
    }

    @media (max-width: 600px) {
      .texto-central h1 {
        font-size: 3em;
      }
      .texto-central p {
        font-size: 1.1em;
      }
    }
  </style>
</head>
<body>

  <div id="lluvia-container"></div>

  <div class="texto-central">
    <h1>Te Amo Melody</h1>
    <p>Toca la pantalla</p>
  </div>

  <script>
    const lluviaContainer = document.getElementById('lluvia-container');
    const body = document.body;
    const totalGotas = 50;

    function iniciarLluvia() {
      for (let i = 0; i < totalGotas; i++) {
        const gota = document.createElement("div");
        gota.classList.add("gota");
        
        if (Math.random() > 0.3) {
            gota.innerText = "Te amo";
        } else {
            gota.innerText = "♥";
        }
        
        gota.style.left = Math.random() * 100 + "vw";
        gota.style.fontSize = (12 + Math.random() * 12) + "px";
        gota.style.animationDuration = (5 + Math.random() * 5) + 's';
        gota.style.animationDelay = Math.random() * 7 + 's'; // Aumentado el rango de retraso
        
        lluviaContainer.appendChild(gota);
      }
    }

    document.addEventListener("click", (e) => {
      const explosion = document.createElement("div");
      explosion.classList.add("explosion");
      explosion.innerText = "Mucho ♥";
      explosion.style.left = e.clientX + "px";
      explosion.style.top = e.clientY + "px";
      
      body.appendChild(explosion);

      setTimeout(() => {
        explosion.remove();
      }, 1200);
    });

    window.addEventListener('load', iniciarLluvia);
  </script>
</body>
</html>
